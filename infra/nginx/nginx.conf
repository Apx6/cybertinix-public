user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

# ---------------------------------------------------------------------------
# Couche 4 : on aiguille le 443 sur le nom SNI sans jamais déchiffrer.
# Indispensable — fleet-telemetry exige de terminer le mTLS lui-même, donc
# aucun proxy ne peut s'interposer sur sa connexion.
#
# Le routage est fait par motif, pas par domaine en dur : rien à modifier
# quand le nom de domaine sera choisi.
# ---------------------------------------------------------------------------
stream {
    # Résolution paresseuse via le DNS interne de Docker. Avec un bloc
    # `upstream`, nginx résout au chargement de la config et refuse de démarrer
    # si le conteneur cible n'est pas encore là — ce qui arrive à chaque
    # amorçage, la télémétrie ayant besoin de certificats qui n'existent pas
    # encore. Passer par une variable diffère la résolution au premier flux.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $ssl_preread_server_name $backend {
        ~^telemetry\.   fleet-telemetry:8443;
        default         127.0.0.1:9443;
    }

    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        proxy_pass $backend;
        proxy_timeout 10m;   # les websockets télémétrie restent ouverts longtemps
    }
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nginx/access.log;
    sendfile      on;
    keepalive_timeout  65;

    # -----------------------------------------------------------------------
    # Port 80 : challenge ACME + redirection.
    # -----------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # -----------------------------------------------------------------------
    # HTTPS applicatif, joignable uniquement via le passthrough SNI ci-dessus.
    # -----------------------------------------------------------------------
    server {
        listen 127.0.0.1:9443 ssl;
        http2 on;

        # Placeholder auto-signé posé par scripts/02-bootstrap-certs.sh, puis
        # remplacé par le vrai certificat Let's Encrypt.
        ssl_certificate     /etc/letsencrypt/live/teslaaddict/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/teslaaddict/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        # La clé publique de l'application. Tesla la relit régulièrement :
        # si elle disparaît, l'appairage des clés virtuelles casse.
        location = /.well-known/appspecific/com.tesla.3p.public-key.pem {
            alias /srv/well-known/com.tesla.3p.public-key.pem;
            default_type application/x-pem-file;
        }

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            # Même raison qu'en amont : résolution différée pour que nginx
            # démarre même si `app` n'est pas encore prêt. Avec une variable
            # dans proxy_pass, nginx ne réécrit plus l'URI — d'où le
            # $request_uri explicite, sans quoi chemin et query sont perdus.
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $app_upstream "app:8000";
            proxy_pass http://$app_upstream$request_uri;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
